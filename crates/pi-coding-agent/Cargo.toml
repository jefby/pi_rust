[package]
name = "pi-coding-agent"
description = "Interactive coding agent CLI (Rust port of @earendil-works/pi-coding-agent). Streaming REPL, session persistence, AGENTS.md loader, slash commands, per-tool permissions. Install with `cargo install pi-coding-agent`; the binary is `pi`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["llm", "ai", "coding-agent", "cli", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "pi"
path = "src/main.rs"

[features]
default = []
# Full-screen terminal UI (ratatui + crossterm). Off by default so the
# default binary stays small; enable with `--features tui`.
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]

[dependencies]
pi-ai = { path = "../pi-ai", version = "1.2.0" }
pi-agent = { path = "../pi-agent", version = "1.2.0" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
ratatui = { version = "0.29", optional = true, features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", optional = true, features = ["event-stream"] }
unicode-width = { version = "0.2", optional = true }
